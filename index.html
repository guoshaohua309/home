<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郭少华 | 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #f6f8fa;
            color: #24292f;
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* 头部横幅 */
        .header {
            background: linear-gradient(135deg, #6b4fd8 0%, #7c5cff 100%);
            color: #fff;
            padding: 3rem 2rem;
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #fff;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #6b4fd8;
            font-weight: bold;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* 主体内容 */
        .main {
            padding: 2.5rem 2rem;
        }

        .section {
            margin-bottom: 2.5rem;
        }

        .section-title {
            font-size: 1.4rem;
            color: #6b4fd8;
            border-left: 4px solid #7c5cff;
            padding-left: 0.8rem;
            margin-bottom: 1rem;
        }

        .info-list {
            list-style: none;
        }

        .info-list li {
            padding: 0.6rem 0;
            font-size: 1rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-list li:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 600;
            color: #3d2b63;
            display: inline-block;
            min-width: 90px;
        }

        /* 技能标签 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .tag {
            background: rgba(124, 92, 255, 0.12);
            color: #6b4fd8;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            font-size: 0.9rem;
        }

        /* 链接按钮 */
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            background: #24292f;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .link-btn:hover {
            background: #444c56;
        }

        /* 底部 */
        .footer {
            text-align: center;
            padding: 1.5rem;
            color: #7a6b9a;
            font-size: 0.9rem;
            border-top: 1px solid #f0f0f0;
        }

        /* GitHub 图标 */
        .github-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="avatar">GS</div>
            <h1>郭少华</h1>
            <p>燕山大学 | 计算机技术 硕士研究生</p>
        </div>

        <!-- 主体内容 -->
        <div class="main">
            <!-- 个人简介 -->
            <div class="section">
                <h2 class="section-title">个人简介</h2>
                <ul class="info-list">
                    <li>
                        <span class="label">姓名：</span>郭少华
                    </li>
                    <li>
                        <span class="label">院校：</span>燕山大学
                    </li>
                    <li>
                        <span class="label">学历：</span>硕士研究生
                    </li>
                    <li>
                        <span class="label">专业：</span>计算机技术
                    </li>
                    <li>
                        <span class="label">研究方向：</span>图数据分析、后端开发、AI 应用开发
                    </li>
                </ul>
            </div>

            <!-- 技术栈 -->
            <div class="section">
                <h2 class="section-title">技术栈</h2>
                <div class="tags">
                    <span class="tag">Java</span>
                    <span class="tag">Spring Boot</span>
                    <span class="tag">Spring AI</span>
                    <span class="tag">Vue3</span>
                    <span class="tag">Vite</span>
                    <span class="tag">C++</span>
                    <span class="tag">SSE 流式通信</span>
                    <span class="tag">Maven</span>
                    <span class="tag">Nginx</span>
                    <span class="tag">MySQL</span>
                </div>
            </div>

            <!-- 项目与链接 -->
            <div class="section">
                <h2 class="section-title">项目 & 主页</h2>
                <div class="links">
                    <a href="https://github.com/guoshaohua309" target="_blank" class="link-btn">
                        <svg class="github-icon" viewBox="0 0 16 16">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
                        </svg>
                        GitHub 主页
                    </a>
                </div>
            </div>
        </div>

        <!-- 底部 -->
        <div class="footer">
            © 2025-2026 郭少华 | 燕山大学 计算机技术硕士
        </div>
    </div>
</body>
</html>
